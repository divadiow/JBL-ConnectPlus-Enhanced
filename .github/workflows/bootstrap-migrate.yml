name: Complete repository migration

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/migrate-connectplus-enhanced'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reassemble and verify maintained project
        run: |
          cat .migration/part-*.b64 | tr -d '\n' | base64 --decode > .migration/project.zip
          echo "aabc3020ab86bdf9bc8ec723897282db15e44f42b4cb25707f6ac7df53b6d6a7  .migration/project.zip" | sha256sum --check --strict
          unzip -t .migration/project.zip

      - name: Expand maintained project
        run: |
          unzip -o .migration/project.zip -d .
          rm -rf .migration
          rm -f .github/workflows/bootstrap-migrate.yml
          rm -f .github/workflows/build-apk.yml

      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate maintained Android project"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
