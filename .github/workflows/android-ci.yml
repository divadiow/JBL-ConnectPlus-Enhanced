name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "dist/**"
      - "**/*.md"
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

jobs:
  test-and-build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ConnectPlusEnhanced-v0.1.1-test2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish current test APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ConnectPlusEnhanced-v0.1.1-test2-debug.apk
          (
            cd dist
            sha256sum ConnectPlusEnhanced-v0.1.1-test2-debug.apk > SHA256SUMS.txt
          )
          if git diff --quiet -- dist/; then
            echo "Published APK is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ConnectPlusEnhanced-v0.1.1-test2-debug.apk dist/SHA256SUMS.txt
          git commit -m "Publish 0.1.1-test2 debug APK [skip ci]"
          git push

  cleanup-merged-agent-branch:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_HEAD_REF}" || true
